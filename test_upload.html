<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload Test - Old To Digital</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #1e1e1e; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .upload-container { margin: 20px 0; border: 2px dashed #555; background: #2a2a2a; padding: 40px; border-radius: 10px; cursor: pointer; }
        .upload-container:hover { border-color: #2196f3; }
        img#preview-image { width: 100%; max-width: 640px; display: none; margin: 20px auto; border-radius: 5px; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; background: #2196f3; color: white; border: none; border-radius: 5px; }
        button:disabled { background: #555; cursor: not-allowed; }
        .results { margin-top: 20px; text-align: left; background: #2d2d2d; padding: 20px; border-radius: 5px; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Image Upload Processing Test</h2>
        
        <p style="color: #bbb;">Select or drag an image of handwritten text to test the extraction.</p>
        
        <div class="upload-container" onclick="document.getElementById('file-input').click()">
            <p id="upload-text">Click to Select Image (JPG, PNG)</p>
            <input type="file" id="file-input" style="display: none;" accept="image/png, image/jpeg, image/jpg" onchange="previewFile()">
        </div>

        <img id="preview-image" alt="Uploaded Preview">

        <button id="btn-process" onclick="uploadAndProcess()" disabled>Extract Text from Image</button>

        <div id="results-box" class="results">
            <h3>Extraction Results:</h3>
            <div id="loading" style="display:none; color: #ffeb3b;">Processing with PaddleOCR + CRNN + LLM... Please wait...</div>
            <pre id="output-text"></pre>
        </div>
    </div>

    <script>
        const baseUrl = "http://127.0.0.1:5000";
        let selectedFile = null;

        function previewFile() {
            const file = document.getElementById("file-input").files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById("preview-image");
                    img.src = e.target.result;
                    img.style.display = "block";
                    document.getElementById("btn-process").disabled = false;
                    document.getElementById("upload-text").innerText = "Selected: " + file.name;
                }
                reader.readAsDataURL(file);
            }
        }

        async function uploadAndProcess() {
            if (!selectedFile) return;

            document.getElementById("results-box").style.display = "block";
            document.getElementById("loading").style.display = "block";
            document.getElementById("output-text").textContent = "";
            document.getElementById("btn-process").disabled = true;

            const formData = new FormData();
            formData.append("file", selectedFile);

            try {
                const res = await fetch(baseUrl + "/upload", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                
                let output = "";
                if(data.success !== false) {
                    output += "--- RAW EXTRACTED TEXT ---\n" + (data.raw_text || "None") + "\n\n";
                    output += "--- LLM REFINED TEXT ---\n" + (data.corrected_text || "None");
                } else {
                    output = "Error: " + (data.message || "Unknown error");
                }
                
                document.getElementById("output-text").textContent = output;
            } catch (e) {
                document.getElementById("output-text").textContent = "Request failed. Check backend console.";
            } finally {
                document.getElementById("loading").style.display = "none";
                document.getElementById("btn-process").disabled = false;
            }
        }
    </script>
</body>
</html>
